---
# Debian/Ubuntu
- block:
    - name: Make sure the python3-debian package is present
      ansible.builtin.apt:
        pkg: python3-debian
        state: present
      register: apt_status
      until: apt_status is success
      delay: 5
      retries: 3
      when: "'python3-debian' not in ansible_facts.packages"

    - name: Ensure /etc/apt/sources.list.d directory exists
      ansible.builtin.file:
        path: /etc/apt/sources.list.d
        state: directory
        mode: "0755"

    - name: Add ProxySQL repository and signing key
      ansible.builtin.deb822_repository:
        name: proxysql
        types: [deb]
        uris: "{{ proxysql_repo_url }}/{{ ansible_distribution_release }}/"
        suites: "./"
        signed_by: "{{ proxysql_repo_url }}/repo_pub_key"
        state: present
        enabled: true
      register: proxysql_apt_repository_status

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      register: apt_status
      until: apt_status is success
      delay: 5
      retries: 3
      when: proxysql_apt_repository_status is changed
  environment: "{{ proxy_env | default({}) }}"
  when:
    - ansible_os_family == "Debian"
    - installation_method == "packages"
    - proxysql_install_repo | bool
  tags: proxysql_repo

# RedHat (the AlmaLinux packages are used for all RHEL-compatible distributions)
- name: Add ProxySQL repository
  ansible.builtin.yum_repository:
    name: proxysql
    description: ProxySQL repository
    baseurl: "{{ proxysql_repo_url }}/almalinux/{{ ansible_distribution_major_version }}"
    gpgkey: "{{ proxysql_repo_url }}/repo_pub_key"
    gpgcheck: true
    enabled: true
  environment: "{{ proxy_env | default({}) }}"
  when:
    - ansible_os_family == "RedHat"
    - installation_method == "packages"
    - proxysql_install_repo | bool
  tags: proxysql_repo

- block:
    # RedHat
    - name: Install ProxySQL package
      ansible.builtin.dnf:
        name: "proxysql{{ '' if proxysql_version | string == 'latest' else '-' ~ proxysql_version }}"
        state: present
      register: package_status
      until: package_status is success
      delay: 5
      retries: 3
      when: ansible_os_family == "RedHat"

    # Debian
    - name: Install ProxySQL package
      ansible.builtin.apt:
        name: "proxysql{{ '' if proxysql_version | string == 'latest' else '=' ~ proxysql_version }}"
        state: present
      register: apt_status
      until: apt_status is success
      delay: 5
      retries: 3
      when: ansible_os_family == "Debian"

    # psql client for the ProxySQL Admin interface on dedicated balancers
    # (on the database servers, the PostgreSQL client installed by Autobase is used)
    - name: Install PostgreSQL client package
      ansible.builtin.package:
        name: "{{ 'postgresql-client' if ansible_os_family == 'Debian' else 'postgresql' }}"
        state: present
      register: package_status
      until: package_status is success
      delay: 5
      retries: 3
      when: inventory_hostname not in groups['postgres_cluster'] | default([])
  environment: "{{ proxy_env | default({}) }}"
  when: installation_method == "packages"
