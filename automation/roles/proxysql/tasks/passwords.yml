---
# ProxySQL passwords: the defined value, or the value from an existing ProxySQL configuration, or a generated one.
# Only a configuration managed by Autobase is trusted (it contains the marker line from proxysql.cnf.j2):
# the packaged default /etc/proxysql.cnf (admin:admin, monitor) must never be adopted as passwords.
- name: Get the current ProxySQL configuration
  ansible.builtin.slurp:
    src: "{{ proxysql_conf_file }}"
  register: proxysql_conf_file_content
  failed_when: false
  no_log: true

- name: Get the ProxySQL configuration of an existing balancer
  ansible.builtin.slurp:
    src: "{{ proxysql_conf_file }}"
  register: proxysql_source_conf_file_content
  delegate_to: "{{ groups['balancers'] | difference(groups['new_balancer'] | default([])) | first | default(inventory_hostname) }}"
  run_once: true
  failed_when: false
  no_log: true

- name: Set ProxySQL passwords
  ansible.builtin.set_fact:
    proxysql_admin_password: >-
      {{ proxysql_admin_password if proxysql_admin_password | default('') | length > 0
         else proxysql_source_admin_password if proxysql_source_admin_password | length > 0
         else lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=32') }}
    proxysql_monitor_password: >-
      {{ proxysql_monitor_password if proxysql_monitor_password | default('') | length > 0
         else proxysql_source_monitor_password if proxysql_source_monitor_password | length > 0
         else lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=32') }}
  vars:
    proxysql_source_conf_raw: "{{ proxysql_source_conf_file_content.content | default('') | b64decode }}"
    proxysql_source_conf: "{{ proxysql_source_conf_raw if '# Managed by Autobase (vitabaks.autobase.proxysql)' in proxysql_source_conf_raw else '' }}"
    proxysql_source_admin_password: "{{ proxysql_source_conf | regex_search('admin_credentials=\"[^:\"]*:([^\"]*)\"', '\\1') | default([''], true) | first }}"
    proxysql_source_monitor_password: "{{ proxysql_source_conf | regex_search('monitor_password=\"([^\"]*)\"', '\\1') | default([''], true) | first }}"
  run_once: true # the facts are applied to all hosts of the play
  no_log: true

# Whether the configuration of this host is managed by Autobase (otherwise it is the packaged default or absent)
- name: Check that the ProxySQL configuration is managed by Autobase
  ansible.builtin.set_fact:
    proxysql_conf_managed: "{{ '# Managed by Autobase (vitabaks.autobase.proxysql)' in proxysql_conf_text }}"
  vars:
    proxysql_conf_text: "{{ proxysql_conf_file_content.content | default('') | b64decode }}"
  no_log: true

# Used to connect to the ProxySQL Admin interface before a new admin password is applied
- name: Set the current ProxySQL Admin password
  ansible.builtin.set_fact:
    proxysql_admin_password_current: >-
      {{ proxysql_conf_text
         | regex_search('admin_credentials="[^:"]*:([^"]*)"', '\1') | default([''], true) | first }}
  vars:
    proxysql_conf_text: "{{ proxysql_conf_file_content.content | default('') | b64decode if proxysql_conf_managed | bool else '' }}"
  no_log: true
