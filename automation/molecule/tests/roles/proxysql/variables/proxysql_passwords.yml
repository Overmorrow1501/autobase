---
# 🚀 Marker logic of passwords.yml: only an Autobase-managed configuration is trusted (not the packaged default)
- name: Molecule.tests.roles.proxysql.variables.proxysql_passwords | Set inputs
  run_once: true
  ansible.builtin.set_fact:
    proxysql_test_conf_packaged: 'admin_credentials="admin:admin"'
    proxysql_test_conf_managed: "# Managed by Autobase (vitabaks.autobase.proxysql)\nadmin_credentials=\"admin:secret\""
    proxysql_test_conf_empty: ""

- name: Molecule.tests.roles.proxysql.variables.proxysql_passwords | Evaluate the passwords.yml expressions
  run_once: true
  ansible.builtin.set_fact:
    proxysql_test_result_packaged: >-
      {{ proxysql_test_conf_packaged if '# Managed by Autobase (vitabaks.autobase.proxysql)' in proxysql_test_conf_packaged else '' }}
    proxysql_test_result_managed: >-
      {{ proxysql_test_conf_managed if '# Managed by Autobase (vitabaks.autobase.proxysql)' in proxysql_test_conf_managed else '' }}
    proxysql_test_result_empty: >-
      {{ proxysql_test_conf_empty if '# Managed by Autobase (vitabaks.autobase.proxysql)' in proxysql_test_conf_empty else '' }}

- name: Molecule.tests.roles.proxysql.variables.proxysql_passwords | Validate the extracted passwords
  run_once: true
  ansible.builtin.assert:
    that:
      - proxysql_test_password_packaged == ''
      - proxysql_test_password_managed == 'secret'
      - proxysql_test_password_empty == ''
    fail_msg: "Unexpected passwords: '{{ proxysql_test_password_packaged }}' '{{ proxysql_test_password_managed }}' '{{ proxysql_test_password_empty }}'"
  vars:
    proxysql_test_password_packaged: >-
      {{ proxysql_test_result_packaged | regex_search('admin_credentials="[^:"]*:([^"]*)"', '\1') | default([''], true) | first }}
    proxysql_test_password_managed: >-
      {{ proxysql_test_result_managed | regex_search('admin_credentials="[^:"]*:([^"]*)"', '\1') | default([''], true) | first }}
    proxysql_test_password_empty: >-
      {{ proxysql_test_result_empty | regex_search('admin_credentials="[^:"]*:([^"]*)"', '\1') | default([''], true) | first }}
