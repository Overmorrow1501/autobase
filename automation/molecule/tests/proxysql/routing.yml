---
# 🚀 Verify that ProxySQL routes each listener port to the expected node role through the cluster VIP
# 🎯 Port 5000 must reach the primary; ports 5001, 5002 and 5003 must reach replicas

- name: Molecule.tests.proxysql.routing | Set VIP address
  run_once: true
  ansible.builtin.set_fact:
    proxysql_test_vip: "10.172.3.200"

- name: Molecule.tests.proxysql.routing | Check pg_is_in_recovery() on each listener port
  run_once: true
  ansible.builtin.command: >-
    {{ postgresql_bin_dir }}/psql "host={{ proxysql_test_vip }} port={{ item.port }} dbname=db1 user=db1_user connect_timeout=5"
    -tAXc "select pg_is_in_recovery()"
  environment:
    PGPASSWORD: "db1_user-test-pass"
  register: proxysql_routing_result
  until: proxysql_routing_result.stdout == item.recovery
  retries: 30
  delay: 2
  changed_when: false
  loop:
    - { port: 5000, recovery: "f" }
    - { port: 5001, recovery: "t" }
    - { port: 5002, recovery: "t" }
    - { port: 5003, recovery: "t" }
