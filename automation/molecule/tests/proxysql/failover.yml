---
# 🚀 Verify that ProxySQL follows an unplanned failover (the leader's Patroni is stopped)
# 🎯 Port 5000 must reach a new leader, and the old leader must rejoin as a streaming replica

- name: Molecule.tests.proxysql.failover | Get cluster configuration
  run_once: true
  become: true
  become_user: postgres
  ansible.builtin.command: patronictl -c /etc/patroni/patroni.yml show-config
  register: proxysql_failover_config
  changed_when: false

# In synchronous mode Patroni promotes only the synchronous standby, so a failover right after
# a switchover (before a replica is registered as synchronous) would elect no leader at all.
- name: Molecule.tests.proxysql.failover | Wait until the cluster has a leader and, in synchronous mode, a synchronous standby
  run_once: true
  become: true
  become_user: postgres
  ansible.builtin.command: patronictl -c /etc/patroni/patroni.yml list -f json
  register: proxysql_failover_list
  until:
    - proxysql_failover_list.rc == 0
    - proxysql_failover_list.stdout | from_json | selectattr('Role', 'equalto', 'Leader') | list | length == 1
    - >-
      not proxysql_failover_sync | bool
      or proxysql_failover_list.stdout | from_json | selectattr('Role', 'in', ['Sync Standby', 'Quorum Standby']) | list | length > 0
  retries: 30
  delay: 2
  changed_when: false
  vars:
    proxysql_failover_sync: >-
      {{ (proxysql_failover_config.stdout | from_yaml).synchronous_mode | default(false) | string | lower not in ['false', 'off'] }}

- name: Molecule.tests.proxysql.failover | Set leader fact
  run_once: true
  ansible.builtin.set_fact:
    leader: "{{ proxysql_failover_list.stdout | from_json | selectattr('Role', 'equalto', 'Leader') | first }}"

- name: Molecule.tests.proxysql.failover | Stop Patroni on the leader
  run_once: true
  become: true
  ansible.builtin.systemd:
    name: patroni
    state: stopped
  delegate_to: "{{ leader.Member }}"

- name: Molecule.tests.proxysql.failover | Wait until port 5000 reaches a new leader
  run_once: true
  ansible.builtin.command: >-
    {{ postgresql_bin_dir }}/psql "host=10.172.3.200 port=5000 dbname=db1 user=db1_user connect_timeout=5"
    -tAXc "select inet_server_addr()"
  environment:
    PGPASSWORD: "db1_user-test-pass"
  register: proxysql_failover_result
  until:
    - proxysql_failover_result.rc == 0
    - proxysql_failover_result.stdout | length > 0
    - proxysql_failover_result.stdout != leader.Host
  retries: 60
  delay: 2
  changed_when: false

- name: Molecule.tests.proxysql.failover | Start Patroni on the old leader
  run_once: true
  become: true
  ansible.builtin.systemd:
    name: patroni
    state: started
  delegate_to: "{{ leader.Member }}"

- name: Molecule.tests.proxysql.failover | Wait until the old leader is streaming
  run_once: true
  become: true
  become_user: postgres
  ansible.builtin.command: patronictl -c /etc/patroni/patroni.yml list -f json
  register: proxysql_failover_state
  until: >-
    (proxysql_failover_state.stdout | from_json | selectattr('Member', 'equalto', leader.Member) | map(attribute='State') | first | default(''))
    == 'streaming'
  retries: 60
  delay: 5
  changed_when: false
