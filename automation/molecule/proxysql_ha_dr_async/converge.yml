---
- name: Converge
  hosts: all
  gather_facts: true

  tasks:
    - name: Set variables for PostgreSQL Cluster deployment test
      ansible.builtin.set_fact:
        ansible_become_method: su # Override become_method
        firewall_enabled_at_boot: false
        firewall_enable_ipv6: false # to prevent test failures in CI
        swap_file_create: false # to prevent test failures in CI
        sysctl_set: false # to prevent test failures in CI
        chronyd_ignore_errors: true # to prevent failures in CI
        nameservers: ["8.8.8.8", "9.9.9.9"]
        timezone: "Etc/UTC"
        with_haproxy_load_balancing: false
        with_proxysql_load_balancing: true
        cluster_vip: "10.172.5.200"
        netdata_install: false
        proxysql_users:
          - { name: "db1_user", max_connections: 500 }
        dcs_type: etcd # fixed (the reference architecture runs etcd on the database nodes); verify reads it from dcs_type.yml
        postgresql_version: 18
        pgbouncer_processes: 2 # Test multiple pgbouncer processes (so_reuseport)
        enable_ssh_key_based_authentication: true
        synchronous_mode: true
        synchronous_node_count: 1
        proxysql_replicas_async_enabled: false # the DR node is excluded by balancer_tags: the 5003 listener would stay empty
        # Use low memory settings to allow testing on machines with limited RAM (e.g. 8 GB).
        # 128MB shared_buffers and 512MB effective_cache_size are safe minimums for a
        # functional test cluster; production sizing should use the defaults (25%/75% of RAM).
        local_postgresql_parameters:
          - { option: "shared_buffers", value: "128MB" }
          - { option: "effective_cache_size", value: "512MB" }
        postgresql_users:
          - { name: "pgbouncer", password: "pgbouncer-test-pass" }
          - { name: "db1_user", password: "db1_user-test-pass" }
        postgresql_databases:
          - { db: "db1", encoding: "UTF8", lc_collate: "en_US.UTF-8", lc_ctype: "en_US.UTF-8", owner: "db1_user" }
        patroni_failsafe_mode: true
        cacheable: true
      delegate_to: localhost
      run_once: true # noqa run-once

    - name: Write dcs_type.yml file (for Molecule verify)
      ansible.builtin.copy:
        content: |
          ---
          dcs_type: "{{ dcs_type }}"
        dest: "../../dcs_type.yml"
      delegate_to: localhost
      run_once: true # noqa run-once

    - name: Update apt cache
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      register: apt_status
      until: apt_status is success
      delay: 5
      retries: 3
      when: ansible_os_family == "Debian"

    - name: Install openssh-server package
      become: true
      ansible.builtin.package:
        name: openssh-server
        state: present

    - name: Start ssh service
      become: true
      ansible.builtin.systemd:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: started
        enabled: true

    - name: Delete "/run/nologin" file (if exists)
      become: true
      ansible.builtin.file:
        path: /run/nologin
        state: absent

- name: Deploy PostgreSQL Cluster test
  ansible.builtin.import_playbook: ../../playbooks/deploy_pgcluster.yml
